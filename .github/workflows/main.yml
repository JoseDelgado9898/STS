name: Scheduled HCP Terraform Reset + Apply

# ---------------------------------------------------------------------------
# The Azure infra behind this workspace is wiped externally every two weeks, so
# the HCP state ends up pointing at a Databricks workspace that no longer
# exists. The default `databricks` provider takes its host from
# azurerm_databricks_workspace.this.workspace_url, so ANY normal plan/apply/
# refresh deadlocks trying to authenticate against the dead workspace.
#
# This job breaks that deadlock on each scheduled run:
#   1. `state rm` (CLI) the resources managed by the dead-host provider plus the
#      dead-workspace account assignments. State ops never configure a provider,
#      so they work with no databricks auth — and they ARE permitted on a
#      VCS-connected workspace.
#   2. A VCS-driven DESTROY run (is-destroy + refresh=false, via the HCP API) —
#      tears down the surviving-but-broken metastore (force_destroy cascades and
#      cleans the orphaned UC objects) plus the account-level resources, via the
#      accounts + azurerm providers (which authenticate fine).
#   3. A VCS-driven APPLY run — greenfield rebuild. A new random_id suffix + a
#      fresh metastore (existing_metastore_id="") means zero name/region
#      collisions.
#
# NOTE: this workspace is VCS-connected, so HCP forbids CLI/API-driven applies
# ("Apply not allowed for workspaces with a VCS connection"). Destroy + apply
# therefore run as VCS-driven runs triggered through the API (the same path the
# original workflow used); only the state surgery uses the CLI. Everything
# executes in HCP, so cloud creds stay in the workspace — the runner only needs
# the HCP token.
# ---------------------------------------------------------------------------

on:
  schedule:
    # Runs EVERY Monday at 09:00 UTC; the gate below narrows it to 1st/3rd.
    - cron: '0 9 * * 1'
  # Allows you to trigger this manually from the UI anytime
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.check_monday.outputs.run_job }}
    steps:
      - name: Check if First or Third Monday
        id: check_monday
        run: |
          # Get the current day of the month (1-31)
          DAY_OF_MONTH=$(date +%-d)

          # First Monday: days 1-7. Third Monday: days 15-21.
          if [[ $DAY_OF_MONTH -le 7 ]] || [[ $DAY_OF_MONTH -ge 15 && $DAY_OF_MONTH -le 21 ]]; then
            echo "This is the first or third Monday. Proceeding."
            echo "run_job=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not the first or third Monday. Skipping."
            echo "run_job=false" >> "$GITHUB_OUTPUT"
          fi

  reset-and-apply:
    needs: gate
    # Run on the 1st/3rd Monday, OR whenever triggered manually.
    if: needs.gate.outputs.run_job == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TF_WORKING_DIR: workspace-setup/terraform-examples/azure/azure-vnet-injection-uc/tf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Match the HCP workspace's Terraform version so the LOCAL `state rm`
          # reads/writes the remote state cleanly. Keep this in sync with the
          # workspace's configured version.
          terraform_version: "1.15.8"
          cli_config_credentials_token: ${{ secrets.HCP_API_TOKEN }}

      - name: Resolve HCP org + workspace name from the workspace ID
        # The cloud integration keys on org + workspace NAME, but we only store
        # the ws-… ID. Derive both from the existing secrets via the HCP API so
        # no extra secrets are needed. Exported to $GITHUB_ENV for later steps.
        env:
          HCP_API_TOKEN: ${{ secrets.HCP_API_TOKEN }}
          HCP_WORKSPACE_ID: ${{ secrets.HCP_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          resp=$(curl -s -w $'\n%{http_code}' \
            --header "Authorization: Bearer ${HCP_API_TOKEN}" \
            --header "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/workspaces/${HCP_WORKSPACE_ID}")
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          if [[ "$code" != "200" ]]; then
            echo "::error::HCP API returned HTTP $code resolving ${HCP_WORKSPACE_ID}"; echo "$body"; exit 1
          fi
          # In the HCP/TFC API the organization's "id" is its name.
          org=$(printf '%s' "$body" | jq -r '.data.relationships.organization.data.id')
          ws=$(printf '%s' "$body" | jq -r '.data.attributes.name')
          if [[ -z "$org" || "$org" == "null" || -z "$ws" || "$ws" == "null" ]]; then
            echo "::error::Could not parse org/workspace name from HCP response"; echo "$body"; exit 1
          fi
          echo "Resolved org='${org}' workspace='${ws}'"
          echo "TF_CLOUD_ORGANIZATION=${org}" >> "$GITHUB_ENV"
          echo "TF_WORKSPACE=${ws}" >> "$GITHUB_ENV"

      - name: Point the CLI at the HCP workspace
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          # Generated only on the runner (never committed), so VCS-ingressed runs
          # of this module are unaffected. Org + workspace come from the
          # TF_CLOUD_ORGANIZATION / TF_WORKSPACE env vars set by the resolve step.
          cat > zz_ci_cloud.tf <<'EOF'
          terraform {
            cloud {}
          }
          EOF

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Forget dead-host resources (state-only; no provider auth)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          # The first 4 are managed by the default (dead-host) databricks provider
          # and would deadlock any refresh/destroy. The last 2 are account-level
          # assignments bound to the wiped workspace_id — forgetting them avoids a
          # 404-on-delete during the destroy run (the workspace they point at is
          # gone, so they are already cleared in reality). This job only runs
          # post-wipe, so removing them is always correct here.
          for addr in \
            'databricks_cluster.uc_single_node[0]' \
            'databricks_catalog.uc_quickstart_sandbox' \
            'databricks_external_location.db_ext_loc' \
            'databricks_storage_credential.db_uc_storage_cred' \
            'databricks_mws_permission_assignment.workspace_access' \
            'databricks_metastore_assignment.this'; do
            terraform state rm "$addr" || echo "  (not in state — skipping $addr)"
          done

      # This workspace is VCS-connected, so HCP rejects CLI/API-driven applies
      # ("Apply not allowed for workspaces with a VCS connection"). The allowed
      # path is a VCS-driven run triggered via the API — which is what the old
      # workflow already used. So the destroy + greenfield apply run as API runs
      # (against the latest VCS config), while only the state surgery above uses
      # the CLI (state ops ARE permitted on VCS workspaces).
      - name: Destroy survivors, then greenfield apply (VCS-driven API runs)
        env:
          HCP_API_TOKEN: ${{ secrets.HCP_API_TOKEN }}
          HCP_WORKSPACE_ID: ${{ secrets.HCP_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          api="https://app.terraform.io/api/v2"
          auth=(-H "Authorization: Bearer ${HCP_API_TOKEN}" -H "Content-Type: application/vnd.api+json")

          # Create a run and block until it reaches a terminal state.
          # $1 = label, $2 = JSON payload
          run_and_wait() {
            local label="$1" payload="$2" rid st attempts=0 applied_posted=0
            rid=$(curl -sf "${auth[@]}" -X POST -d "$payload" "$api/runs" | jq -r '.data.id')
            if [[ -z "$rid" || "$rid" == "null" ]]; then
              echo "::error::$label: run was not created"; exit 1
            fi
            echo "$label run: $rid"
            echo "  https://app.terraform.io/app/${TF_CLOUD_ORGANIZATION}/workspaces/${TF_WORKSPACE}/runs/$rid"
            while true; do
              sleep 15
              attempts=$((attempts + 1))
              st=$(curl -sf "${auth[@]}" "$api/runs/$rid" | jq -r '.data.attributes.status' || echo "unknown")
              echo "  [$label] status: $st"
              case "$st" in
                applied|planned_and_finished)
                  echo "  [$label] complete ($st)"; return 0 ;;
                errored|canceled|force_canceled|discarded|policy_soft_failed)
                  echo "::error::$label ended in state: $st"; exit 1 ;;
                planned)
                  # Auto-apply not honored (workspace setting off) — confirm once.
                  if [[ "$applied_posted" == "0" ]]; then
                    echo "  [$label] plan finished; confirming apply"
                    curl -sf "${auth[@]}" -X POST -d '{"comment":"CI auto-apply"}' \
                      "$api/runs/$rid/actions/apply" || true
                    applied_posted=1
                  fi ;;
              esac
              if [[ "$attempts" -ge 240 ]]; then   # ~60 min ceiling
                echo "::error::$label timed out after ~60m (last status: $st)"; exit 1
              fi
            done
          }

          # is-destroy + refresh=false: the 4 dead-host resources are already out
          # of state, so nothing configures the dead provider; the metastore's
          # force_destroy cascades and cleans the orphaned UC objects.
          destroy_payload=$(jq -n --arg ws "$HCP_WORKSPACE_ID" \
            '{data:{type:"runs","attributes":{"message":"CI biweekly reset: destroy survivors","is-destroy":true,"refresh":false,"auto-apply":true},"relationships":{"workspace":{"data":{"type":"workspaces","id":$ws}}}}}')
          apply_payload=$(jq -n --arg ws "$HCP_WORKSPACE_ID" \
            '{data:{type:"runs","attributes":{"message":"CI biweekly reset: greenfield apply","auto-apply":true},"relationships":{"workspace":{"data":{"type":"workspaces","id":$ws}}}}}')

          run_and_wait "destroy" "$destroy_payload"
          run_and_wait "apply"   "$apply_payload"
